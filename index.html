<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JulekPy v3.6 | Ultimate Recon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background-color: #050505; color: #00ff41; font-family: 'JetBrains+Mono', monospace; }
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #004411; border-radius: 10px; }
        .glitch-text { text-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 overflow-hidden">
    <header class="flex justify-between items-center border-b border-green-900 pb-2 mb-4">
        <div>
            <h1 class="text-2xl font-bold glitch-text uppercase tracking-widest">JulekPy v3.6</h1>
            <p class="text-[10px] text-green-700 uppercase">Bounty Hunter Command Center | Location: Cieszyn</p>
        </div>
        <div id="clock" class="font-bold">00:00:00</div>
    </header>

    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-hidden">
        <div class="bg-black border border-green-500/30 rounded-xl p-4 flex flex-col overflow-hidden shadow-[0_0_15px_rgba(0,255,65,0.05)]">
            <h3 class="text-xs font-black mb-4 border-b border-green-900 pb-2 uppercase tracking-widest">Live Recon Bot</h3>
            <div id="bot-console" class="flex-1 terminal-scroll overflow-y-auto text-[11px] space-y-1"></div>
            <div class="mt-4 pt-4 border-t border-green-900 flex gap-2">
                <button onclick="startBot()" id="bot-btn" class="flex-1 bg-green-600 text-black font-bold py-2 rounded text-xs hover:bg-green-400 transition-all uppercase">Start Auto-Recon</button>
                <button onclick="clearLogs()" class="px-4 border border-green-900 text-green-900 py-2 rounded text-xs">Reset</button>
            </div>
        </div>

        <div class="flex flex-col gap-4 overflow-hidden">
            <div class="bg-black/40 border border-green-900 p-4 rounded-xl">
                <h3 class="text-xs font-black mb-3 uppercase">Python Manual Overdrive</h3>
                <textarea id="editor" class="w-full h-32 bg-black border border-green-900/50 p-2 text-sm text-green-400 font-mono rounded outline-none resize-none" placeholder="print('Hello Bounty Hunter')"></textarea>
                <button onclick="runPython()" class="w-full mt-2 border border-green-600 py-2 text-xs font-bold hover:bg-green-600 hover:text-black transition-all uppercase">Wykonaj Kod</button>
                <div id="py-output" class="mt-2 text-[10px] text-blue-400 h-10 overflow-y-auto italic"></div>
            </div>

            <div class="bg-black/40 border border-green-900 p-4 rounded-xl flex-1 overflow-hidden flex flex-col">
                <h3 class="text-xs font-black mb-3 uppercase">Instant Dorking (Cele)</h3>
                <div class="flex-1 overflow-y-auto terminal-scroll space-y-2" id="dork-list"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
