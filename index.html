<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JULEKPY V3.8 | KINGPIN RECON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #00ff41; font-family: 'JetBrains+Mono', monospace; overflow: hidden; }
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #004411; border-radius: 10px; }
        .glitch-text { text-shadow: 0 0 10px #00ff41; }
        .dork-card { border: 1px solid #004411; background: rgba(0,0,0,0.5); transition: 0.2s; }
        .dork-card:hover { border-color: #00ff41; background: rgba(0,255,65,0.05); }
    </style>
</head>
<body class="h-screen flex flex-col p-3">

    <header class="flex justify-between items-center border-b border-green-900 pb-2 mb-3">
        <div>
            <h1 class="text-xl font-bold glitch-text tracking-tighter">JULEKPY V3.8</h1>
            <p class="text-[9px] text-green-700 uppercase">Location: Cieszyn | Status: Triaged</p>
        </div>
        <div id="clock" class="text-xs font-bold">00:00:00</div>
    </header>

    <div class="flex-1 flex flex-col gap-3 overflow-hidden">
        
        <div class="flex-[1.2] border border-green-900 rounded-lg p-3 flex flex-col overflow-hidden bg-black/40">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-green-500 uppercase">Live Recon Console</span>
                <div class="flex gap-1"><div class="w-2 h-2 bg-red-600 animate-pulse rounded-full"></div></div>
            </div>
            <div id="bot-console" class="flex-1 terminal-scroll overflow-y-auto text-[11px] space-y-1 opacity-80">
                <div class="text-green-900 italic">>> System initialized...</div>
            </div>
            <button onclick="toggleBot()" id="bot-btn" class="mt-3 w-full bg-green-600 text-black font-bold py-2 rounded text-xs uppercase hover:bg-green-400 transition-all">Start Recon Bot</button>
        </div>

        <div class="flex-1 border border-green-900 rounded-lg p-3 flex flex-col overflow-hidden bg-black/40">
            <h3 class="text-[10px] font-bold mb-3 uppercase text-blue-500">Target Finder & Checker</h3>
            <div id="dork-list" class="flex-1 overflow-y-auto terminal-scroll space-y-2">
                </div>
        </div>

    </div>

    <script>
        let botRunning = false;
        const dorkData = [
            { name: "Wyciek .ENV", d: 'filetype:env "DB_PASSWORD"', path: '/.env' },
            { name: "Bazy SQL", d: 'filetype:sql "password"', path: '/backup.sql' },
            { name: "Klucze Firebase", d: 'site:firebaseio.com', path: '/.json' },
            { name: "Logi Serwera", d: 'filetype:log "login failed"', path: '/access.log' }
        ];

        function init() {
            renderDorks();
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        }

        function logBot(msg, color = "text-green-400") {
            const console = document.getElementById('bot-console');
            const div = document.createElement('div');
            div.className = color;
            div.innerHTML = `<span class="opacity-30">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            console.appendChild(div);
            console.scrollTop = console.scrollHeight;
        }

        function toggleBot() {
            botRunning = !botRunning;
            const btn = document.getElementById('bot-btn');
            if(botRunning) {
                btn.innerText = "Recon Active...";
                btn.className = "mt-3 w-full bg-red-900 text-red-200 font-bold py-2 rounded text-xs uppercase animate-pulse";
                runFakeRecon();
            } else {
                btn.innerText = "Start Recon Bot";
                btn.className = "mt-3 w-full bg-green-600 text-black font-bold py-2 rounded text-xs uppercase hover:bg-green-400";
            }
        }

        async function runFakeRecon() {
            const subs = ["dev", "staging", "api", "internal", "backup"];
            while(botRunning) {
                let s = subs[Math.floor(Math.random()*subs.length)];
                logBot(`Scanning ${s}.google.com...`, "text-green-800");
                await new Promise(r => setTimeout(r, 1500));
                if(Math.random() > 0.85) {
                    logBot(`[!!!] POTENTIAL LEAK FOUND ON ${s}.google.com`, "text-yellow-400 font-bold");
                }
            }
        }

        function renderDorks() {
            const list = document.getElementById('dork-list');
            dorkData.forEach(item => {
                const div = document.createElement('div');
                div.className = "dork-card p-2 rounded";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-bold text-green-400">${item.name}</span>
                        <button onclick="checkTarget('${item.path}')" class="text-[8px] bg-blue-900 px-2 py-0.5 rounded uppercase font-bold text-white">Check</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(item.d)}')" class="flex-1 text-[8px] border border-green-800 py-1 uppercase opacity-60 hover:opacity-100">Szukaj w Google</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function checkTarget(path) {
            const url = prompt("Wklej adres strony z Google (np. http://target.com):");
            if(!url) return;
            logBot(`Testing: ${url}${path}...`, "text-blue-400");
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url + path)}`);
                const data = await res.json();
                if(data.status.http_code === 200) {
                    logBot(`[!!!] SUCCESS! Plik ${path} jest dostępny!`, "text-white bg-red-900 px-1 font-bold");
                    alert("ZNALAZŁEŚ DANE! Zrób screena i raportuj do Google!");
                } else {
                    logBot(`[i] Status ${data.status.http_code}: Brak dostępu.`);
                }
            } catch(e) { logBot(`[!] Błąd połączenia.`); }
        }

        window.onload = init;
    </script>
</body>
</html>
            <div class="bg-black/40 border border-green-900 p-4 rounded-xl">
                <h3 class="text-xs font-black mb-3 uppercase">Python Manual Overdrive</h3>
                <textarea id="editor" class="w-full h-32 bg-black border border-green-900/50 p-2 text-sm text-green-400 font-mono rounded outline-none resize-none" placeholder="print('Hello Bounty Hunter')"></textarea>
                <button onclick="runPython()" class="w-full mt-2 border border-green-600 py-2 text-xs font-bold hover:bg-green-600 hover:text-black transition-all uppercase">Wykonaj Kod</button>
                <div id="py-output" class="mt-2 text-[10px] text-blue-400 h-10 overflow-y-auto italic"></div>
            </div>

            <div class="bg-black/40 border border-green-900 p-4 rounded-xl flex-1 overflow-hidden flex flex-col">
                <h3 class="text-xs font-black mb-3 uppercase">Instant Dorking (Cele)</h3>
                <div class="flex-1 overflow-y-auto terminal-scroll space-y-2" id="dork-list"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
